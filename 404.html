<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | Security Interview Preparation</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#141414">
  <meta name="color-scheme" content="dark light">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("sd-theme");
        var theme = saved === "light" || saved === "dark"
          ? saved
          : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", theme);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#f3f1ec" : "#141414");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <link rel="icon" href="https://rajanagori.in/favicon.ico" type="image/x-icon">
  <style>
    html[data-theme="dark"],
    :root {
      --bg: #141414;
      --text: #f2f0ec;
      --muted: rgba(242, 240, 236, 0.68);
      color-scheme: dark;
    }

    html[data-theme="light"] {
      --bg: #f3f1ec;
      --text: #1f1b16;
      --muted: rgba(31, 27, 22, 0.68);
      color-scheme: light;
    }

    body {
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }

    a { color: #ff8c00; }

    html[data-theme="light"] a { color: #e67a00; }

    p { max-width: 28rem; line-height: 1.5; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>That URL is not on this site.</p>
    <p>
      Go to the <a href="/">home page</a>, the
      <a href="/play/">Play course</a>, or the
      <a href="/interview/">topic library</a>.
    </p>
    <p>
      Often requested:
      <a href="/interview/?topic=http-request-smuggling">HTTP Request Smuggling</a>,
      <a href="/interview/?topic=ssrf">SSRF</a>,
      <a href="/interview/?topic=threat-modeling">Threat Modeling</a>.
    </p>
  </main>
</body>
</html>
