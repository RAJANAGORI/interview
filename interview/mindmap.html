<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logic Chart</title>
  <script>
    (function () {
      var q = new URLSearchParams(window.location.search);
      var dest = new URL("./", window.location.href);
      var topic = q.get("topic");
      if (topic) dest.searchParams.set("topic", topic);
      dest.searchParams.set("file", "mindMap");
      window.location.replace(dest.toString());
    })();
  </script>
</head>
<body>
  <p>Opening the logic chart in the topic view.</p>
</body>
</html>
