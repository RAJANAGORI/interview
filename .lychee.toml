# Link checker config for Content CI (lycheeverse/lychee-action).
# External doc hosts occasionally return transient 5xx/network errors from runners.

timeout = 30
max_retries = 5
retry_wait_time = 5

# Accept common success + transient gateway / rate-limit responses.
accept = [200, 204, 206, 301, 302, 307, 308, 429, 502, 503, 504]

# Interview guides use illustrative SSRF/XXE/CSRF URLs that are not real pages.
exclude_all_private = true

exclude = [
  # Local / metadata / file schemes (also covered partly by exclude_all_private)
  '^file://',
  '^https?://localhost(?::|/|$)',
  '^https?://127\.0\.0\.1',
  '^https?://\[::1\]',
  '^https?://\[::ffff:',
  '^https?://2130706433',
  '^https?://169\.254\.',
  '^https?://192\.168\.',
  '^https?://10\.',
  '^https?://172\.(1[6-9]|2[0-9]|3[01])\.',
  '^https?://internal[-.]server',
  # Placeholder victim / attacker hosts in CSRF, clickjacking, open-redirect examples
  '^https?://bank\.com',
  '^https?://attacker\.com',
  '^https?://evil\.com',
  '^https?://(.*\.)?example\.(com|org|net)(/|$)',
  '^https?://trusted\.example',
  # XML parser feature URIs and claim namespaces (not HTTP documents)
  '^https?://apache\.org/xml/',
  '^https?://xml\.org/sax/',
  '^https?://schemas\.xmlsoap\.org/',
]
